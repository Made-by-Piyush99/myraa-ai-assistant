name: Build MYRAA Mobile APK

on:
  push:
    paths:
      - 'mobile_application/**'
      - '.github/workflows/build-mobile-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x mobile_application/gradlew

      - name: Build Debug APK
        working-directory: mobile_application
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Mobile-APK
          path: mobile_application/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
